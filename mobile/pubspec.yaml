name: swara
description: Swara - A Sinhala-Based Intelligent Framework for Supporting Children with Stuttering
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP Client
  dio: ^5.4.3+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Audio
  record: ^5.1.2
  just_audio: ^0.9.38
  path_provider: ^2.1.3

  # File Picker
  file_picker: ^8.1.7

  # Image Picker
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.62.0

  # Networking / Cache
  cached_network_image: ^3.3.1

  # Date/Time
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.8

  # Typography
  google_fonts: ^6.2.1

  # Misc utilities
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/common/
    - assets/images/component3/
    - assets/images/component4/
    - assets/illustrations/
    - assets/icons/
    - assets/audio/
